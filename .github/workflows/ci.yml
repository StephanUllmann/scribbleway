name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Ubuntu 24.04 (ubuntu-latest's default image) ships KF5 + Qt 6.4, but this project
    # needs KF6 + Qt 6.6+ (QtQuick.Effects, find_package(KF6)). Run inside an ubuntu:25.04
    # container, which packages KF6 6.12 and Qt 6.8.
    container: ubuntu:25.04
    steps:
      - name: Install git (needed by actions/checkout in a bare container)
        run: |
          apt-get update
          apt-get install -y git

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y \
            build-essential \
            cmake \
            extra-cmake-modules \
            libkf6globalaccel-dev \
            kglobalacceld \
            dbus \
            liblayershellqtinterface-dev \
            qt6-base-dev \
            qt6-declarative-dev \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-templates \
            qml6-module-qtquick-shapes \
            qml6-module-qtquick-effects

      - name: Configure
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_DEB_PACKAGE=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        # QTEST_MAIN needs a QPA platform (offscreen), and OverlayController's shortcut
        # tests need the kglobalacceld daemon on a session bus or KGlobalAccel segfaults.
        run: |
          export QT_QPA_PLATFORM=offscreen
          dbus-run-session -- bash -c '
            /usr/lib/x86_64-linux-gnu/libexec/kglobalacceld >/dev/null 2>&1 &
            sleep 3
            ctest --test-dir build --output-on-failure
          '

  # Produces the installable Arch package as a downloadable artifact, so it can
  # be tried in a VM (or on a real Arch/Hyprland box) without building locally.
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git cmake extra-cmake-modules \
            layer-shell-qt kglobalaccel qt6-declarative qt6-base

      - uses: actions/checkout@v4
        with:
          # PKGBUILD's pkgver() runs git describe / rev-list against the checkout.
          fetch-depth: 0

      - name: Build package
        run: |
          # makepkg refuses to run as root.
          useradd -m builduser
          chown -R builduser:builduser .
          # Build from this checkout instead of cloning upstream, so the artifact
          # matches the commit under test.
          sed -i 's|source=(.*)|source=("scribbleway::git+file://'"$PWD"'")|' packaging/arch/PKGBUILD
          sudo -u builduser git config --global --add safe.directory "$PWD"
          sudo -u builduser bash -c 'cd packaging/arch && makepkg --noconfirm'

      - uses: actions/upload-artifact@v4
        with:
          name: scribbleway-arch-package
          path: packaging/arch/*.pkg.tar.zst
